<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Skyline Valley — Ring Runner: a 2D chase-view flight game. Take off, thread the rings down the valley, and land back on the runway.">
<link rel="icon" href="data:,">
<title>Skyline Valley — Ring Runner</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1220; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Skyline Valley Ring Runner: fly the valley, thread the rings, land on the runway"></canvas>
<noscript><p style="color:#fff;font-family:monospace;padding:2em">Skyline Valley needs JavaScript to fly. Please enable it and reload.</p></noscript>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
